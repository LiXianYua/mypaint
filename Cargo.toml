[package]
name = "libmypaint"
version = "0.1.0"
edition = "2021"
description = "A Rust port of libmypaint brush engine"
license = "ISC"

[features]
default = []
ffi = ["dep:libc"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "0.17"
thiserror = "2"
libc = { version = "0.2", optional = true }

[dev-dependencies]
rstest = "0.23"

[build-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
