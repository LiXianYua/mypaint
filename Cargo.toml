[package]
name = "libmypaint"
version = "0.1.0"
edition = "2021"
description = "A Rust port of libmypaint brush engine (1:1 reproduction of the C library)"
license = "ISC"
readme = "README.md"
keywords = ["graphics", "paint", "brush", "drawing", "libmypaint"]
categories = ["graphics", "multimedia::images", "rendering"]
authors = ["liyang"]
repository = "https://github.com/liyang/rust_libmypaint"
documentation = "https://docs.rs/libmypaint"
exclude = ["libmypaint-upstream/", "tests/brushes/bad/*.bad-myb"]

[lib]
# rlib：让 Rust 使用者用；cdylib：让 C 客户端 dlopen / 链接 .so
crate-type = ["rlib", "cdylib"]

[features]
default = []
ffi = ["dep:libc"]
# 启用 OpenMP 风格的 tile 并行渲染（对应 C 上游 threadsafe_tile_requests）
parallel = ["dep:rayon"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "0.17"
thiserror = "2"
libc = { version = "0.2", optional = true }
rayon = { version = "1.10", optional = true }

[dev-dependencies]
rstest = "0.23"

[build-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
